name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch: {}

jobs:
  # API type safety. The stacked security PRs change route signatures, shared types, and
  # middleware Variables generics with nothing verifying they still compile — this closes
  # that gap.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: release flags not past removeAfter
        run: npx tsx scripts/checkFeatureFlags.ts

  # API unit tests (specs import without MONGO_URI).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  # Mobile: svelte-check fails on type/template errors (not on warnings).
  svelte-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: svelte-check
        run: npm run check
