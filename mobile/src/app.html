<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<style>
			/* Static, framework-free — the app is ssr:false and the root load() blocks on
			   session restore (which can be a Render cold start, up to ~50s), so nothing
			   Svelte-rendered exists yet to show a spinner. This has to live here and get
			   removed by the layout's onMount once the app actually mounts. */
			#boot-splash {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 0.9rem;
				background: #eff4f1;
				color: #212623;
				font-family:
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					'Helvetica Neue',
					Arial,
					sans-serif;
				padding: 0 1.5rem;
				text-align: center;
			}
			@media (prefers-color-scheme: dark) {
				#boot-splash {
					background: #141816;
					color: #e6ebe8;
				}
				#boot-splash .spinner {
					border-color: #2a3330;
					border-top-color: #67c4a2;
				}
				#boot-splash p {
					color: #a8b3ae;
				}
			}
			#boot-splash .spinner {
				width: 32px;
				height: 32px;
				border-radius: 50%;
				border: 3px solid #d9e2dc;
				border-top-color: #3f9c7c;
				animation: boot-spin 0.8s linear infinite;
			}
			#boot-splash p {
				margin: 0;
				max-width: 280px;
				font-size: 0.85rem;
				line-height: 1.5;
				color: #57635d;
			}
			@keyframes boot-spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot-splash">
			<div class="spinner"></div>
			<p>Waking up the kitchen&hellip;<br />this can take up to a minute on first launch.</p>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
